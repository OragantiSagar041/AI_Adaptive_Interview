<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">

<head>
  <meta charset="UTF-8" />
  <!-- ── Viewport ───────────────────────────────────── -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Favicon / App Icons ───────────────────────── -->
  <link rel="icon" type="image/png" href="/hireiq.png" />
  <link rel="apple-touch-icon" href="/hireiq.png" />
  <meta name="theme-color" content="#0f172a" />

  <!-- ── Primary SEO Meta ──────────────────────────── -->
  <title>HireIQ — #1 AI Interview Platform & AI Recruitment Software India</title>
  <meta name="description" content="HireIQ is India's leading AI interview platform & AI recruitment software. Features AI mock interviews, automated HR screening tool, AI calling agent for recruitment, and bulk hiring software." />
  <meta name="keywords" content="AI interview platform India, AI recruitment software India, Automated HR screening tool, AI mock interview platform, Bulk hiring software India, AI calling agent for recruitment, Online interview platform India, AI candidate screening software, Hire IQ, HireIQ, AI hiring India, automated recruitment India" />
  <meta name="author" content="HireIQ" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <link rel="canonical" href="https://hireiq.co.in/" />

  <!-- ── Open Graph (Facebook / LinkedIn) ──────────── -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="HireIQ" />
  <meta property="og:url" content="https://hireiq.co.in/" />
  <meta property="og:title" content="HireIQ — #1 AI Interview Platform & AI Recruitment Software India" />
  <meta property="og:description" content="HireIQ is India's #1 AI interview platform & AI recruitment software. Automate HR screening, run AI mock interviews, and scale bulk hiring with our AI calling agent." />
  <meta property="og:image" content="https://hireiq.co.in/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="HireIQ AI Recruitment Platform & Online Interview Software India" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:locale:alternate" content="en_US" />

  <!-- ── Twitter Card ──────────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@HireIQ_AI" />
  <meta name="twitter:creator" content="@HireIQ_AI" />
  <meta name="twitter:title" content="HireIQ — #1 AI Interview Platform & AI Recruitment Software India" />
  <meta name="twitter:description" content="HireIQ is India's #1 AI interview platform & AI recruitment software. Automate HR screening, run AI mock interviews, and scale bulk hiring with our AI calling agent." />
  <meta name="twitter:image" content="https://hireiq.co.in/og-image.png" />
  <meta name="twitter:image:alt" content="HireIQ AI Recruitment Platform Dashboard" />

  <!-- ── Additional SEO ────────────────────────────── -->
  <meta name="application-name" content="HireIQ" />
  <meta name="generator" content="HireIQ Platform" />
  <meta name="category" content="HR Technology, Recruitment, Artificial Intelligence" />
  <meta name="classification" content="Business" />
  <meta name="coverage" content="Worldwide" />
  <meta name="distribution" content="Global" />
  <meta name="rating" content="General" />
  <meta name="revisit-after" content="7 days" />

  <!-- ── Structured Data: Organization ────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "HireIQ",
    "alternateName": ["Hire IQ", "HireIQ AI", "HireIQ India"],
    "url": "https://hireiq.co.in",
    "logo": "https://hireiq.co.in/hireiq.png",
    "description": "HireIQ is India's leading AI interview platform, AI recruitment software, and automated HR screening tool providing bulk hiring software and AI calling agents.",
    "foundingDate": "2024",
    "email": "hello@hireiq.co.in",
    "sameAs": [
      "https://www.linkedin.com/company/hireiq-ai",
      "https://twitter.com/HireIQ_AI"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "sales",
      "email": "hello@hireiq.co.in",
      "availableLanguage": ["English", "Hindi"]
    }
  }
  </script>

  <!-- ── Structured Data: SoftwareApplication ─────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "HireIQ",
    "alternateName": "HireIQ AI Interview & Recruitment Platform",
    "operatingSystem": "Web",
    "applicationCategory": "BusinessApplication",
    "applicationSubCategory": "HRSoftware",
    "description": "India's premier AI interview platform and AI recruitment software featuring AI mock interviews, automated HR screening tools, AI calling agents, and bulk hiring capabilities.",
    "url": "https://hireiq.co.in",
    "screenshot": "https://hireiq.co.in/og-image.png",
    "featureList": [
      "AI Interview Platform India",
      "AI Recruitment Software India",
      "Automated HR Screening Tool",
      "AI Mock Interview Platform",
      "Bulk Hiring Software India",
      "AI Calling Agent for Recruitment",
      "Online Interview Platform India",
      "AI Candidate Screening Software",
      "Predictive Candidate Scoring",
      "Real-time Technical & HR Analytics",
      "ATS Integration"
    ],
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "INR",
      "description": "Free demo available for Indian and global enterprises."
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.9",
      "reviewCount": "150",
      "bestRating": "5"
    }
  }
  </script>

  <!-- ── Structured Data: WebSite + Search ─────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "HireIQ",
    "alternateName": "Hire IQ",
    "url": "https://hireiq.co.in",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://hireiq.co.in/?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- ── Performance Hints ──────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <link rel="dns-prefetch" href="https://checkout.razorpay.com" />

  <!-- ── Google Fonts ───────────────────────────────── -->
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- ── FontAwesome Icons ──────────────────────────── -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- ── Third-party Scripts ───────────────────────── -->
  <!-- Razorpay Checkout -->
  <script defer src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <!-- SheetJS for exporting Excel -->
  <script defer src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <!-- Chart.js for data visualization -->
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
