server {
    listen 80;

    # ─── HTML: never cache — ensures fresh CSP headers on every deployment ───
    location ~* \.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob: https://checkout.razorpay.com https://cdn.razorpay.com https://cdn.sheetjs.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' http://localhost:8000 ws://localhost:8000 https://kr-088a4cf6c7ba48c48290be99a8acf5eb.ecs.us-east-1.on.aws wss://kr-088a4cf6c7ba48c48290be99a8acf5eb.ecs.us-east-1.on.aws https://api.razorpay.com https://cdn.razorpay.com https://lumberjack.razorpay.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://storage.googleapis.com; worker-src 'self' blob:; frame-src https://api.razorpay.com https://checkout.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri /index.html;
    }

    # ─── Static assets: aggressively cache (WASM, TFLite, JS, CSS, fonts) ───
    location ~* \.(?:wasm|tflite|png|jpg|jpeg|gif|ico|css|js|mp4|svg|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob: https://checkout.razorpay.com https://cdn.razorpay.com https://cdn.sheetjs.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' http://localhost:8000 ws://localhost:8000 https://kr-088a4cf6c7ba48c48290be99a8acf5eb.ecs.us-east-1.on.aws wss://kr-088a4cf6c7ba48c48290be99a8acf5eb.ecs.us-east-1.on.aws https://api.razorpay.com https://cdn.razorpay.com https://lumberjack.razorpay.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://storage.googleapis.com; worker-src 'self' blob:; frame-src https://api.razorpay.com https://checkout.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        access_log off;
        try_files $uri =404;
    }

    # ─── SPA fallback ────────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob: https://checkout.razorpay.com https://cdn.razorpay.com https://cdn.sheetjs.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' http://localhost:8000 ws://localhost:8000 https://kr-088a4cf6c7ba48c48290be99a8acf5eb.ecs.us-east-1.on.aws wss://kr-088a4cf6c7ba48c48290be99a8acf5eb.ecs.us-east-1.on.aws https://api.razorpay.com https://cdn.razorpay.com https://lumberjack.razorpay.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://storage.googleapis.com; worker-src 'self' blob:; frame-src https://api.razorpay.com https://checkout.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }

    # ─── Proxy API requests to the backend container ─────────────────────────
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Proxy static uploads to the backend container ───────────────────────
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }
}
